version: '3'

services:
  webapp:
    build:
      context: ./
      dockerfile: webapp.Dockerfile
    container_name: farmcommerce-webapp
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - api
    volumes:
      - ./:/var/app/:rw,cached
    env_file:
      - 'variables.env'
    command: >
      sh -c '
      yarn install &&
      yarn dev
      '
  api:
    build:
      context: ./
      dockerfile: api.Dockerfile
    container_name: farmcommerce-api
    ports:
      - '3003:3003'
      - '8226:8226'
    depends_on:
      - database
    volumes:
      - ./:/var/app/:rw,cached
    env_file:
      - 'variables.env'
    command: >
      sh -c '
      yarn install &&
      yarn build &&
      yarn db:init &&
      yarn migrate:latest &&
      yarn seed:run dev &&
      yarn dev
      '
  database:
    container_name: farmcommerce-database
    environment:
      DEBUG: 'false'
      POSTGRES_HOST_AUTH_METHOD: 'trust'
      POSTGRES_PASSWORD: '${PG_PASSWD:-postgres}'
      POSTGRES_USER: '${PG_USER:-postgres}'
      POSTGRES_DB: '${PG_DATABASE:-main}'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '6432:5432'
    image: postgres:14
    restart: unless-stopped
    volumes:
      - farmcommerce_pgdata:/var/lib/postgresql/data
  caching:
    image: redis:alpine3.16
    container_name: farmcommerce-caching
    ports:
      - '7379:6379'
    volumes:
      - farmcommerce_cache:/data
    user: redis
volumes:
  farmcommerce_cache:
  farmcommerce_pgdata:
