version: '3'

services:
  reverse-proxy:
    build:
      context: ./webapp
      dockerfile: nginx.Dockerfile
    container_name: farmcommerce-reverse-proxy
    ports:
      - "443:443"
      - "80:80"
    restart: always
  webapp:
    tmpfs: /tmp
    command: >
      sh -c '
      yarn install &&
      yarn build &&
      yarn start
      '
  api:
    tmpfs:
      - /tmp
      - /usr/local/share/.cache/yarn
      - /root/.npm/_logs
      - /root/.npm/_cacache
    ports:
      - '3003:3003'
    command: >
      sh -c '
      yarn install &&
      yarn build &&
      yarn db:init &&
      yarn migrate:latest &&
      yarn seed:run prod &&
      yarn start
      '

