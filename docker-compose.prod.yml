version: '3'

services:
  reverse-proxy:
    build:
      context: ./webapp
      dockerfile: nginx.Dockerfile
    container_name: farmcommerce-reverse-proxy
    ports:
      - "443:443"
      - "80:80"
    restart: always
  webapp:
    command: >
      sh -c '
      yarn install &&
      yarn build &&
      yarn start
      '
  api:
    ports:
      - '3003:3003'
    command: >
      sh -c '
      yarn install &&
      yarn build &&
      yarn db:init &&
      yarn migrate:latest &&
      yarn seed:run prod &&
      yarn start
      '
