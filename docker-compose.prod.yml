version: '3'

services:
  webapp:
    ports:
      - '80:80'
    command: >
      sh -c '
      yarn install &&
      yarn build &&
      yarn start
      '
  api:
    ports:
      - '3003:3003'
    command: >
      sh -c '
      yarn install &&
      yarn build &&
      yarn db:init &&
      yarn migrate:latest &&
      yarn seed:run prod &&
      yarn start
      '
